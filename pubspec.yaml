name: connectbeat
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  flutter_riverpod: ^2.3.6
  cupertino_icons: ^1.0.8
  http: ^0.13.5
  kakao_flutter_sdk: ^1.9.7+3
  google_sign_in: ^6.2.1
  logging: ^1.2.0
  image_picker: ^0.8.7+5
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  stomp_dart_client: ^0.4.4
  fl_chart: ^0.69.0
  flutter_animate: ^4.2.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.6
  freezed: ^2.4.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/clothes/
    - assets/images/backgrounds/
    - assets/images/characters/ch_0/
    - assets/images/characters/ch_1/
    - assets/images/characters/ch_2/
    - assets/images/characters/ch_3/
    - assets/images/characters/ch_4/
    - assets/images/characters/ch_5/
    - assets/images/characters/ch_6/
    - assets/images/characters/ch_7/
    - assets/images/characters/ch_8/
    - assets/images/characters/ch_9/
    - assets/images/characters/ch_10/
    - assets/images/characters/ch_11/
    - assets/images/characters/ch_12/
    - assets/images/characters/ch_13/
    - assets/images/characters/ch_14/
    - assets/images/characters/ch_15/
    - .env
  fonts:
    - family: GamjaFlower
      fonts:
        - asset: assets/fonts/GamjaFlower-Regular.ttf
    - family: GowunBatang
      fonts:
        - asset: assets/fonts/GowunBatang-Regular.ttf
    - family: PoorStory
      fonts:
        - asset: assets/fonts/PoorStory-Regular.ttf
